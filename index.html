<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuadernos - Helios</title>

<!-- LIBRERIAS -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }

header {
  background:#e00000;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

/* TABS */
.tabs {
  background:#b60000;
  display:flex;
  gap:15px;
  padding:10px;
}

.tab {
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.tab.active {
  border-bottom:3px solid #fff;
}

/* SECCIONES */
.seccion { display:none; padding:15px; }
.activa { display:block; }

/* CASCADAS */
.card {
    background:white;
    padding:20px;
    width:25%;
    text-align:center;
    border-radius:10px;
}
.kpis { display:flex; justify-content:center; gap:20px; margin:20px; }

.plan{border:3px solid #4a6cff;}
.real{border:3px solid gray;}
.desv{border:3px solid red;}
</style>
</head>

<body>

<header>📊 Cuadernos - Helios</header>

<div class="tabs">
  <div class="tab active" onclick="mostrar('dependencias',this)">📌 Tablero de Dependencias</div>
  <div class="tab" onclick="mostrar('cascadas',this)">📊 Tablero de Cascadas</div>
</div>

<!-- ================= DEPENDENCIAS ================= -->
<div id="dependencias" class="seccion activa">

<h2>Tablero de Dependencias</h2>
<button onclick="cargarDependencias()">📂 Cargar Excel Dependencias</button>
<input type="file" id="fileInputDep" style="display:none">

<div id="graficoDependencias"></div>

</div>

<!-- ================= CASCADAS ================= -->
<div id="cascadas" class="seccion">

<h2>Tablero de Cascadas</h2>

<button onclick="document.getElementById('fileInputCascadas').click()">📂 Cargar Excel Cascadas</button>
<input type="file" id="fileInputCascadas" style="display:none">

<div class="kpis">
<div class="card plan"><h3>Plan</h3><h1 id="plan">0%</h1></div>
<div class="card real"><h3>Real</h3><h1 id="real">0%</h1></div>
<div class="card desv"><h3>Desv</h3><h1 id="desv">0%</h1></div>
</div>

<div id="graficoCascadas"></div>

</div>

<script>

/* TABS */
function mostrar(id,el){
document.querySelectorAll('.seccion').forEach(s=>s.classList.remove('activa'));
document.getElementById(id).classList.add('activa');

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}

/* ================= DEPENDENCIAS ================= */
function cargarDependencias(){
document.getElementById("fileInputDep").click();
}

document.getElementById("fileInputDep").addEventListener("change", function(e){
let reader = new FileReader();

reader.onload = function(evt){
let wb = XLSX.read(new Uint8Array(evt.target.result), {type:'array'});

let data = [];
let ws = wb.Sheets[wb.SheetNames[0]];
data = XLSX.utils.sheet_to_json(ws);

renderDependencias(data);
};

reader.readAsArrayBuffer(e.target.files[0]);
});

function renderDependencias(data){

let criticidad = {};

data.forEach(r=>{
let c = r["Criticidad"] || "Otros";
criticidad[c] = (criticidad[c]||0)+1;
});

Plotly.newPlot("graficoDependencias", [{
labels:Object.keys(criticidad),
values:Object.values(criticidad),
type:"pie"
}],{title:"Dependencias por Criticidad"});

}

/* ================= CASCADAS ================= */

document.getElementById('fileInputCascadas').addEventListener('change', e=>{
let reader=new FileReader();

reader.onload=e=>{
let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
procesarCascadas(wb);
};

reader.readAsArrayBuffer(e.target.files[0]);
});

function procesarCascadas(wb){

let frentes=[], plan=[], real=[];

wb.SheetNames.forEach(s=>{
let ws=wb.Sheets[s];

let p = ws["N3"] ? ws["N3"].v : 0;
let r = ws["R3"] ? ws["R3"].v : 0;

if(p<=1) p*=100;
if(r<=1) r*=100;

frentes.push(s);
plan.push(p);
real.push(r);
});

actualizarCascadas(frentes,plan,real);
}

function actualizarCascadas(f,p,r){

let P=prom(p);
let R=prom(r);
let D=P-R;

document.getElementById("plan").innerText=P.toFixed(0)+"%";
document.getElementById("real").innerText=R.toFixed(0)+"%";
document.getElementById("desv").innerText=D.toFixed(0)+"%";

Plotly.newPlot("graficoCascadas",[
{x:f,y:p,type:'bar',name:'Planificado',marker:{color:'red'}},
{x:f,y:r,type:'bar',name:'Real',marker:{color:'pink'}}
]);
}

function prom(a){
return a.reduce((x,y)=>x+y,0)/a.length;
}

</script>

</body>
</html>
