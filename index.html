<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuaderno - Proyecto Helios</title>

https://cdn.plot.ly/plotly-latest.min.js
https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.jsscript>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }

/* HEADER */
header {
    background:#e00000;
    color:white;
    padding:15px;
}

/* TITULO */
.titulo-principal{
    font-size:20px;
    font-weight:bold;
}

.tabs {
    background:#b60000;
    display:flex;
    gap:15px;
    padding:10px;
}

.tab {
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.tab:hover { text-decoration:underline; }

/* SECCIONES */
.seccion { display:none; padding:20px; }
.activa { display:block; }

/* KPIs */
.kpis { display:flex; gap:20px; margin:20px; }
.card {
    background:white;
    padding:20px;
    flex:1;
    text-align:center;
    border-radius:10px;
}

.plan{border:3px solid blue;}
.real{border:3px solid gray;}
.desv{border:3px solid red;}

button{
    background:orange;
    border:none;
    padding:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>
<div class="titulo-principal">📊 Cuaderno - Proyecto Helios</div>
</header>

<!-- MENU -->
<div class="tabs">
<div class="tab" onclick="mostrar('dependencias')">📌 Tablero de Dependencias</div>
<div class="tab" onclick="mostrar('cascadas')">📊 Tablero de Cascadas</div>
</div>

<!-- ===================== DEPENDENCIAS ===================== -->
<div id="dependencias" class="seccion activa">

<h2>Tablero de Dependencias</h2>

<button onclick="cargarExcel()">📂 Cargar Excel</button>

<div id="graficoDependencias"></div>

</div>

<!-- ===================== CASCADAS ===================== -->
<div id="cascadas" class="seccion">

<h2>Tablero de Cascadas</h2>

<div class="kpis">
<div class="card plan"><h3>Plan</h3><h1 id="plan">0%</h1></div>
<div class="card real"><h3>Real</h3><h1 id="real">0%</h1></div>
<div class="card desv"><h3>Desv</h3><h1 id="desv">0%</h1></div>
</div>

<div id="graficoCascadas"></div>

</div>

<input type="file" id="fileInput" style="display:none">

<script>

/* ================= NAVEGACION ================= */
function mostrar(id){
document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
}

/* ================= EXCEL ================= */
function cargarExcel(){
document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change",function(e){
let reader=new FileReader();

reader.onload=e=>{
let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});

procesarCascadas(wb);
procesarDependencias(wb);
};

reader.readAsArrayBuffer(e.target.files[0]);
});

/* ================= CASCADAS ================= */
function procesarCascadas(wb){

let frentes=[], plan=[], real=[];

wb.SheetNames.forEach(s=>{
let ws=wb.Sheets[s];

let p = ws["N3"] ? ws["N3"].v : 0;
let r = ws["R3"] ? ws["R3"].v : 0;

if(p<=1) p*=100;
if(r<=1) r*=100;

frentes.push(s);
plan.push(p);
real.push(r);
});

actualizarCascadas(frentes,plan,real);
}

function actualizarCascadas(f,p,r){

let P=prom(p);
let R=prom(r);
let D=P-R;

plan.innerText=P.toFixed(0)+"%";
real.innerText=R.toFixed(0)+"%";
desv.innerText=D.toFixed(0)+"%";

Plotly.newPlot("graficoCascadas",[
{x:f,y:p,type:'bar',name:'Plan',marker:{color:'red'}},
{x:f,y:r,type:'bar',name:'Real',marker:{color:'pink'}}
]);
}

/* ================= DEPENDENCIAS ================= */
function procesarDependencias(wb){

let labels=["Alta","Media","Baja"];
let values=[50,30,20]; // ejemplo (puedes conectar a Excel)

Plotly.newPlot("graficoDependencias",[
{
labels:labels,
values:values,
type:'pie'
}
],
{title:"Dependencias por Criticidad"}
);
}

/* ================= UTILS ================= */
function prom(a){
return a.reduce((x,y)=>x+y,0)/a.length;
}

</script>

</body>
</html>
